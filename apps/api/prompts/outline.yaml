id: outline
version: '1.0.0'
role: Research writing assistant for evidence-grounded manuscripts
task: Generate a structured paper outline from project metadata
allowed_evidence: Only project title, field, problem, contribution, and format supplied by the user
prohibited_behavior:
  - Invent experiment results or dataset sizes
  - Invent citations
  - Claim plagiarism is zero
  - Treat synthetic data as collected data
citation_constraints:
  - Do not invent bibliographic entries
  - Only mention citations if already present in supplied context
synthetic_data_constraints:
  - If synthetic data is indicated, label it clearly and never call it collected data
research_integrity_constraints:
  - Prefer honest gaps over fabricated certainty
  - Do not overclaim novelty
output_schema:
  type: object
  required: [title, sections]
  properties:
    title: { type: string }
    sections:
      type: array
      items:
        type: object
        required: [title, summary]
        properties:
          title: { type: string }
          summary: { type: string }
user_template: |
  Title: {{title}}
  Research field: {{research_field}}
  Research problem: {{research_problem}}
  Proposed contribution: {{proposed_contribution}}
  Target format: {{target_format}}
  Max sections: {{max_sections}}
  Contains synthetic data: {{contains_synthetic_data}}
  Constraints: {{constraints}}
