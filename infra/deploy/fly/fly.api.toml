# =============================================================================
# ResearchForge API — Fly.io app config
#
# Reuses the existing image: infra/docker/Dockerfile.api (no separate Dockerfile).
# Build context must be the repo root, so always deploy from the repo root:
#
#   fly launch --no-deploy --copy-config \
#     --config infra/deploy/fly/fly.api.toml \
#     --dockerfile infra/docker/Dockerfile.api
#
#   fly deploy \
#     --config infra/deploy/fly/fly.api.toml \
#     --dockerfile infra/docker/Dockerfile.api
#
# Secrets are NOT set here — use `fly secrets set` (see infra/deploy/DEPLOYMENT.md).
# =============================================================================

app = "researchforge-api"
primary_region = "lhr"

[build]
  # Path is resolved relative to THIS file's directory (infra/deploy/fly/), not
  # the working directory — and it overrides any --dockerfile passed on the CLI.
  dockerfile = "../../docker/Dockerfile.api"

# Runs on a temporary machine with the same image + secrets before the new
# release goes live. Alembic's env.py uses the ASYNC url (DATABASE_URL / asyncpg),
# not DATABASE_URL_SYNC — see infra/deploy/DEPLOYMENT.md, "Database URLs".
[deploy]
  release_command = "alembic upgrade head"
  strategy = "immediate"

[env]
  APP_ENV = "production"
  API_HOST = "0.0.0.0"
  API_PORT = "8000"
  LOG_LEVEL = "INFO"
  # Cookies ride the Vercel origin via the Next.js rewrite proxy, so no cookie
  # domain is set. COOKIE_SECURE is forced true by app_env=production anyway.
  COOKIE_SECURE = "true"
  COOKIE_SAMESITE = "lax"
  S3_USE_SSL = "true"
  S3_REGION = "auto"
  RATE_LIMIT_ENABLED = "true"

[http_service]
  internal_port = 8000
  force_https = true
  # Always-on: no cold starts for reviewers. Set auto_stop_machines = "suspend"
  # and min_machines_running = 0 if you'd rather trade latency for cost.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

  # /health/live is process-liveness only. Do NOT use /health/ready here — it
  # probes Postgres and Redis, so a brief Supabase/Upstash blip would make Fly
  # kill an otherwise healthy machine.
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health/live"

[[vm]]
  # 256 MB (Fly's free-allowance size) is not enough: the API pulls in SQLAlchemy,
  # pandas/numpy and the export stack. 512 MB is the smallest size that runs
  # reliably — this is a paid shared-cpu-1x, roughly $2-4/mo.
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
  cpu_kind = "shared"
  processes = ["app"]
