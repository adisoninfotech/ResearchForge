# EXAMPLE ONLY — create real secrets via sealed-secrets / external-secrets / cloud KMS.
apiVersion: v1
kind: Secret
metadata:
  name: researchforge-secrets
  namespace: researchforge
type: Opaque
stringData:
  SECRET_KEY: replace-with-32+-char-secret
  CSRF_SECRET: replace-with-different-32+-char-secret
  DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/researchforge
  DATABASE_URL_SYNC: postgresql+psycopg://user:pass@postgres:5432/researchforge
  REDIS_URL: redis://:password@redis:6379/0
  CELERY_BROKER_URL: redis://:password@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:password@redis:6379/2
  S3_ACCESS_KEY: replace
  S3_SECRET_KEY: replace
  LLM_API_KEY: replace
