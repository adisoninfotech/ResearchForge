apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: researchforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/example/researchforge-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: researchforge-secrets
          env:
            - name: APP_ENV
              value: production
            - name: AI_LOG_PROMPT_TEXT
              value: 'false'
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: researchforge
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
