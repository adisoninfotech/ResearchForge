apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: researchforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: web
          image: ghcr.io/example/researchforge-web:latest
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: researchforge
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
