apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: researchforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: ghcr.io/example/researchforge-api:latest
          command:
            ['celery', '-A', 'app.workers.celery_app:celery_app', 'worker', '--loglevel=INFO']
          envFrom:
            - secretRef:
                name: researchforge-secrets
          env:
            - name: APP_ENV
              value: production
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: researchforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: ghcr.io/example/researchforge-api:latest
          command: ['celery', '-A', 'app.workers.celery_app:celery_app', 'beat', '--loglevel=INFO']
          envFrom:
            - secretRef:
                name: researchforge-secrets
